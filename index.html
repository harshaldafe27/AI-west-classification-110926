<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe4" />
    <title>Waste Lens</title>
    <meta name="description" content="AI waste classification workspace that classifies visible materials from images into actionable breakdowns." />
    <meta property="og:title" content="Waste Lens" />
    <meta property="og:description" content="AI waste classification workspace that classifies visible materials from images into actionable breakdowns." />
    <script>
      // Prevent benign sandbox Vite HMR WebSocket disconnect messages from triggering uncaught rejection overlays
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.toString())) || '';
        if (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('failed to connect to websocket') !== -1) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
